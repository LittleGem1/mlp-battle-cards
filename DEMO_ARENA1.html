<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena 1 Demo</title>
<link rel="stylesheet" href="./public/assets/arena_fx/arena_1_jade_palace.css">
<style>
  body{margin:0;background:#08101f;color:#fff;font-family:Arial,sans-serif}
  .arena{position:relative;width:min(1200px,96vw);height:min(68vh,760px);margin:28px auto;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .ui{position:absolute;inset:auto 18px 18px 18px;z-index:2;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
  .card{width:120px;height:180px;border-radius:14px;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.25)}
  .banner{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:2;padding:10px 20px;background:rgba(8,12,28,.72);border:1px solid rgba(255,220,170,.24);border-radius:999px}
</style>
</head>
<body>
  <div class="arena arena-jade_palace">
    <div id="arenaVfx" class="arena-vfx"></div>
    <div class="banner">Arena 1 – Chinesischer Jadepalast</div>
    <div class="ui"><div class="card"></div><div class="card"></div></div>
  </div>
<script src="./public/assets/arena_fx/arena_1_jade_palace.js"></script>
<script>buildJadePalaceArenaVfx(document.getElementById('arenaVfx'));</script>
</body>
</html>
