<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sweetie Bot – Einbau Modul Test</title><link rel="stylesheet" href="sweetie-bot/sweetie-bot.css"><style>body{background:#13142e;color:#fff;font:16px system-ui;margin:2rem;text-align:center}.board{display:flex;gap:5vw;justify-content:center;align-items:center;flex-wrap:wrap;margin:3rem auto}.board img,.target{width:min(40vw,260px);aspect-ratio:2/3;border:3px solid #c06aff;border-radius:14px;object-fit:cover}.target{background:linear-gradient(150deg,#1f5080,#17152e);display:grid;place-content:center;font-size:28px}.target b{font-size:85px}button{padding:15px 30px;background:#ae34c5;color:white;border:0;border-radius:12px;font-size:20px;cursor:pointer}button:disabled{opacity:.5}</style></head><body><h1>Sweetie Bot – Einbau-Modul-Test</h1><p>Voiceline zuerst, danach Schüsse, Bildschirmtreffer und halbierter Kategorienwert.</p><div class="board"><img id="hero" src="assets/sweetie-bot.png" alt="Sweetie Bot"><div id="enemy" class="target"><div>Gegnerkarte</div><div>ENERGIE</div><b id="value">8</b></div></div><button id="play">Animation starten</button><script type="module">import {playSweetieBotAnimation} from './sweetie-bot/sweetie-bot.js';document.getElementById('play').addEventListener('click',async()=>{const b=document.getElementById('play'),v=document.getElementById('value');b.disabled=true;v.textContent='8';try{await playSweetieBotAnimation({sourceElement:document.getElementById('hero'),targetElement:document.getElementById('enemy'),voiceUrl:'./assets/sweetie-bot-voice.mp3',oldValue:8,newValue:4,onValueReveal:()=>v.textContent='4'});}finally{b.disabled=false;}});</script></body></html>
