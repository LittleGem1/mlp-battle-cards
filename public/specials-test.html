<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLP Battle Cards – zwei Specials</title><link rel="stylesheet" href="/special-cards/sweetie-bot.css"><link rel="stylesheet" href="/special-cards/helements-of-armory.css"><style>body{margin:0;background:radial-gradient(circle at top,#38202e,#080b18 75%);color:white;font:16px system-ui}.arena{min-height:100vh;padding:24px;box-sizing:border-box}.cards{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-items:center}.cards img{width:min(28vw,210px);min-width:135px;border-radius:14px;border:2px solid #f6a9ed}.enemy,.deck{position:relative;display:grid;place-content:center;text-align:center;gap:12px;min-width:155px;min-height:220px;padding:15px;border:2px solid #ce84bc;border-radius:14px;background:#271634}.enemy b,.deck b{font-size:64px}button{padding:12px 20px;margin:12px 8px;border:0;border-radius:10px;background:#cc5db1;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.5}h1,p{text-align:center}</style></head><body><div id="arena" class="arena"><h1>MLP Battle Cards – beide Specials testen</h1><p>Vorschau mit öffentlichen Dateipfaden wie beim Express-Server</p><div class="cards"><img id="sweetie" src="/assets/sweetie-bot.png" alt="Sweetie Bot"><div class="enemy" id="enemy">Gegner: ENERGIE<b id="value">8</b></div><img id="helements" src="/assets/helements-of-armory.png" alt="Helements of Armory"><div class="deck" id="deck">Mein Artefakt-Deck<b id="count">6</b></div></div><p><button id="play-sweetie">Sweetie Bot testen</button><button id="play-helements">Helements testen</button></p></div><script type="module">import {showSpecialEffect} from '/special-cards/register-specials.js';let busy=false;const buttons=[document.querySelector('#play-sweetie'),document.querySelector('#play-helements')];async function play(which){if(busy)return;busy=true;buttons.forEach(b=>b.disabled=true);try{if(which==='sweetie_bot'){document.querySelector('#value').textContent='8';await showSpecialEffect({cardId:'sweetie_bot',previousValue:8,newValue:4},{sourceElement:document.querySelector('#sweetie'),targetElement:document.querySelector('#enemy')},{onValueReveal:()=>document.querySelector('#value').textContent='4'});}else{document.querySelector('#count').textContent='6';await showSpecialEffect({cardId:'helements_of_armory',grantedArtifactName:'Rubin-Krone',deckCountBefore:6,deckCountAfter:7},{sourceElement:document.querySelector('#helements'),deckElement:document.querySelector('#deck'),arenaElement:document.querySelector('#arena')},{onArtifactGranted:()=>document.querySelector('#count').textContent='7'});}}finally{buttons.forEach(b=>b.disabled=false);busy=false;}}buttons[0].onclick=()=>play('sweetie_bot');buttons[1].onclick=()=>play('helements_of_armory');</script></body></html>
